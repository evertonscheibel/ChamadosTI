# /etc/nginx/sites-available/frizelo-rh  (link em sites-enabled)
# O acesso de fora é controlado pelo ufw (portas 45873 e 3100 só para a rede interna).

# Central do RH: http://10.1.1.53:45873
server {
    listen 45873;
    server_name _;
    client_max_body_size 25m;
    access_log /var/log/nginx/frizelo-rh-central.access.log;
    error_log  /var/log/nginx/frizelo-rh-central.error.log;
    location / {
        proxy_pass http://127.0.0.1:45874;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Chatwoot (administração e anexos): http://10.1.1.53:3100
server {
    listen 3100;
    server_name _;
    client_max_body_size 40m;
    access_log /var/log/nginx/frizelo-rh-chatwoot.access.log;
    error_log  /var/log/nginx/frizelo-rh-chatwoot.error.log;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
