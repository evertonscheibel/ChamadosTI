# /etc/nginx/sites-available/frizelo-rh  (link em sites-enabled)
# O acesso de fora é controlado pelo ufw (portas 45873 e 3100 só para a rede interna).
# HTTPS com o certificado do servidor; quem chegar por http:// na mesma porta é redirecionado (erro 497).

# Central do RH: https://10.1.1.53:45873
server {
    listen 45873 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/bridge-industrial/bridge-industrial.crt;
    ssl_certificate_key /etc/ssl/bridge-industrial/bridge-industrial.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FrizeloRhSSL:10m;
    ssl_session_timeout 10m;
    error_page 497 =301 https://$host:$server_port$request_uri;
    client_max_body_size 25m;
    access_log /var/log/nginx/frizelo-rh-central.access.log;
    error_log  /var/log/nginx/frizelo-rh-central.error.log;
    location / {
        proxy_pass http://127.0.0.1:45874;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure;
        proxy_read_timeout 120s;
    }
}

# Chatwoot (administração e anexos): https://10.1.1.53:3100
server {
    listen 3100 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/bridge-industrial/bridge-industrial.crt;
    ssl_certificate_key /etc/ssl/bridge-industrial/bridge-industrial.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FrizeloRhSSL:10m;
    ssl_session_timeout 10m;
    error_page 497 =301 https://$host:$server_port$request_uri;
    client_max_body_size 40m;
    access_log /var/log/nginx/frizelo-rh-chatwoot.access.log;
    error_log  /var/log/nginx/frizelo-rh-chatwoot.error.log;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_flags ~ secure;
        proxy_read_timeout 120s;
    }
}
