name: frizelo-central
x-defaults: &defaults
  restart: unless-stopped
  networks: [central]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *defaults
    image: ${POSTGRES_IMAGE}
    container_name: central-postgres
    mem_limit: 512m
    cpus: 0.50
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./state/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U evolution -d evolution"]
      interval: 15s
      timeout: 5s
      retries: 10
  redis:
    <<: *defaults
    image: ${REDIS_IMAGE}
    container_name: central-redis
    mem_limit: 192m
    cpus: 0.25
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [./state/redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 5s
      retries: 5
  evolution:
    <<: *defaults
    image: ${EVOLUTION_IMAGE}
    container_name: central-evolution
    mem_limit: 1g
    cpus: 1.0
    ports: ["127.0.0.1:18081:8080"]
    env_file: evolution.env
    volumes: [./state/evolution:/evolution/instances]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
  waha:
    <<: *defaults
    image: ${WAHA_IMAGE}
    container_name: central-waha
    mem_limit: 1536m
    cpus: 1.0
    shm_size: 256m
    ports: ["127.0.0.1:18082:3000"]
    env_file: waha.env
    volumes:
      - ./state/waha-sessions:/app/.sessions
      - ./state/waha-media:/app/.media
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/sessions',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

networks:
  central:
    name: frizelo-central
